<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="cointainer mt-3 bg-light">
        <div align="center" class="">
            <div class="header">
                <h1 class="word">Register</h1>
           </div>
           <h2 class="word">
            <form action="/register" method="POST">
                <div class="row m-3">
                    <div class="col-4">
                        <label>Username:</label>
                    </div>
                    <div class="col-8">
                        <input type="text" name="username" id="username" placeholder="Enter your username" class="textbox form-control"><br><br>
                    </div>
                </div>
                <div class="row m-3">
                    <div class="col-4">
                        <label>E-mail:</label>
                    </div>
                    <div class="col-8">
                        <input type="text" name="e-mail" id="e-mail" placeholder="Enter your e-mail" class="textbox form-control"><br><br>
                    </div>
                </div>
                <div class="row m-3">
                    <div class="col-4">
                        <label>Achievments:</label>
                    </div>
                    <div class="col-8">
                        <input type="text" name="achievments" id="acheivments" placeholder="eg. Class tenth passed somehow, BSC Passed, JEE Passed etc." class="textbox form-control"><br><br>
                    </div>
                </div>
                <div class="row m-3">
                    <div class="col-4">
                        <label>Password:</label>
                    </div>
                    <div class="col-8">
                        <input type="password" name="password" id="password" placeholder="Enter your password" class="textbox form-control"><br><br>
                    </div>
                </div>
                <input type="submit" value="Register" class="btn-btn-info"><br><br>
            </form>
           </h2>
        </div>
    </div>
</body>
</html>
